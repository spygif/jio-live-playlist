name: Auto Update Jio STB Master Playlist

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours (UTC)
  workflow_dispatch:      # 1-Click manual trigger button in GitHub Actions tab

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Channel Updater & Health Verification
        run: |
          python update_channels.py --cloud

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u update_channels.log
          git commit -m "Auto-update live IPTV channels [skip ci]" || echo "No changes to commit"
          git push
